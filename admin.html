<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Админ-панель</title>
  </head>
  <body>
    <section id="login-view" class="card narrow" hidden>
      <h1>Админ-панель</h1>
      <p class="muted">Только для владельцев ресторана.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="primary">Войти</button>
      </form>
      <p id="login-status" class="status" role="status"></p>
    </section>

    <section id="mfa-view" class="card narrow" hidden>
      <h1>Двухфакторная защита</h1>
      <p id="mfa-text" class="muted"></p>
      <div id="mfa-enroll" hidden>
        <img id="mfa-qr" alt="QR-код для приложения-аутентификатора" width="200" height="200" />
        <p class="muted">Или введите ключ вручную: <code id="mfa-secret"></code></p>
      </div>
      <form id="mfa-form">
        <label for="mfa-code">Код из приложения</label>
        <input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required />
        <button type="submit" class="primary">Подтвердить</button>
      </form>
      <p id="mfa-status" class="status" role="status"></p>
      <button id="mfa-logout" type="button" class="ghost">Выйти</button>
    </section>

    <main id="panel-view" hidden>
      <header class="bar">
        <div>
          <h1 id="panel-title">Админ-панель</h1>
          <p id="panel-meta" class="muted"></p>
        </div>
        <button id="logout" type="button" class="ghost">Выйти</button>
      </header>

      <nav class="tabs" aria-label="Разделы">
        <button type="button" data-tab="menu" class="active">Меню</button>
        <button type="button" data-tab="tables">Столы и QR</button>
        <button type="button" data-tab="staff">Персонал</button>
        <button type="button" data-tab="log">Журнал</button>
        <button type="button" data-tab="security">Безопасность</button>
      </nav>

      <p id="notice" class="notice" role="status" hidden></p>

      <section id="tab-menu" class="tab"></section>
      <section id="tab-tables" class="tab" hidden></section>
      <section id="tab-staff" class="tab" hidden></section>
      <section id="tab-log" class="tab" hidden></section>
      <section id="tab-security" class="tab" hidden></section>
    </main>

    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
